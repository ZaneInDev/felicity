name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Gradle Wrapper JAR
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle Wrapper JAR present and non-empty"
          else
            echo "::warning::gradle-wrapper.jar missing or empty before restore step"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Confirm Gradle Wrapper JAR after restore
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle Wrapper JAR restore checkpoint: OK"
          else
            echo "::error::Gradle Wrapper JAR restore checkpoint: FAILED"
            exit 1
          fi

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/libs/*.jar
          if-no-files-found: warn
